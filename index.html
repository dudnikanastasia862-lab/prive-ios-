<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PRIVÉ">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>PRIVÉ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:wght@500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #0a0a0a;
    color: #f5e6d3;
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    padding: 20px 18px 150px 18px;
    max-width: 600px;
    margin: 0 auto;
  }

  /* === 3D МОЛОЧНЫЙ ТЕКСТ С ПЕРЕЛИВАЮЩИМСЯ ЗОЛОТОМ === */
  .lux-text {
    font-family: 'Playfair Display', 'Didot', 'Bodoni MT', serif;
    color: #f5e6d3;
    background: linear-gradient(90deg, #D4AF37 0%, #FFF8DC 20%, #FFD700 40%, #FFF8DC 60%, #D4AF37 80%, #FFF8DC 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite;
    text-shadow:
      0 1px 0 #e8d5b7,
      0 2px 0 #d4b896,
      0 3px 0 #b89968,
      0 4px 8px rgba(0,0,0,0.8);
    -webkit-text-stroke: 0.3px #D4AF37;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .logo {
    text-align: center;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 8px;
  }

  .subtitle {
    text-align: center;
    font-size: 14px;
    letter-spacing: 4px;
    color: #D4AF37;
    margin-bottom: 30px;
    font-style: italic;
  }

  .section-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    margin: 25px 0 15px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.4);
  }

  .input-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 10px;
  }

  .row {
    display: flex;
    gap: 8px;
  }

  input[type="text"] {
    flex: 1;
    padding: 14px 12px;
    background: rgba(26, 26, 26, 0.8);
    border: 1px solid #D4AF37;
    color: #f5e6d3;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    border-radius: 4px;
    outline: none;
    min-width: 0;
  }

  input[type="text"]::placeholder { color: #8a7a5a; }

  input:focus {
    border-color: #FFD700;
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
  }

  .btn {
    background: #E10600;
    color: #fff;
    border: none;
    padding: 14px 18px;
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
  }

  .btn:hover, .btn:active {
    background: #FFD700;
    color: #0a0a0a;
    transform: translateY(-1px);
  }

  .btn-full { width: 100%; }

  .voice-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    padding: 0;
    font-size: 26px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #E10600;
    border: 2px solid #fff;
    box-shadow: 0 0 0 0 rgba(225, 6, 0, 0.7);
  }

  .voice-btn.recording {
    animation: pulse-red 1.2s infinite;
    background: #ff2a2a;
  }

  @keyframes pulse-red {
    0% { box-shadow: 0 0 0 0 rgba(225, 6, 0, 0.9); }
    70% { box-shadow: 0 0 0 20px rgba(225, 6, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(225, 6, 0, 0); }
  }

  .task-list { list-style: none; }

  .task {
    background: rgba(26, 26, 26, 0.7);
    border: 1px solid #D4AF37;
    border-left: 3px solid #D4AF37;
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideIn 0.3s ease;
  }

  .task.urgent {
    border-color: #E10600;
    border-left: 3px solid #E10600;
    background: rgba(40, 10, 10, 0.6);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .task-text {
    flex: 1;
    font-size: 16px;
    color: #f5e6d3;
    word-break: break-word;
  }

  .task.done .task-text {
    text-decoration: line-through;
    opacity: 0.5;
  }

  .task-date {
    font-size: 12px;
    color: #D4AF37;
    white-space: nowrap;
    font-style: italic;
  }

  .task-btn {
    background: transparent;
    border: 1px solid #D4AF37;
    color: #D4AF37;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    padding: 0;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .task-btn:hover {
    background: #D4AF37;
    color: #0a0a0a;
  }

  .task-btn.del {
    border-color: #E10600;
    color: #E10600;
  }

  .task-btn.del:hover {
    background: #E10600;
    color: #fff;
  }

  .empty {
    text-align: center;
    color: #5a4a2a;
    font-style: italic;
    padding: 20px;
    font-size: 14px;
  }

  /* === ГУБЫ В ПРАВОМ НИЖНЕМ УГЛУ === */
  .lips-fab {
    position: fixed;
    bottom: 25px;
    right: 20px;
    font-size: 85px;
    line-height: 1;
    z-index: 100;
    transform: rotate(-28deg);
    transform-origin: center center;
    animation: kiss 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    filter: drop-shadow(0 6px 20px rgba(225, 6, 0, 0.8));
    cursor: pointer;
    pointer-events: auto;
    user-select: none;
    -webkit-user-select: none;
  }

  @keyframes kiss {
    0%, 100% {
      transform: rotate(-28deg) scale(1);
    }
    18% {
      transform: rotate(-28deg) scale(1.15);
    }
    38% {
      transform: rotate(-28deg) scale(0.6);
    }
    55% {
      transform: rotate(-28deg) scale(0.65);
    }
    75% {
      transform: rotate(-28deg) scale(1.08);
    }
  }

  /* === ЛЕТАЮЩИЕ СЕРДЕЧКИ И ГУБКИ === */
  .floater {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    font-size: 28px;
    opacity: 0;
    will-change: transform, opacity;
  }

  .floater.heart { color: #E10600; text-shadow: 0 0 12px rgba(225, 6, 0, 0.9); }
  .floater.kiss { color: #ff2a3a; filter: drop-shadow(0 0 8px rgba(225, 6, 0, 0.7)); }

  /* Разные траектории — генерируются JS */
  @keyframes floatUp {
    0% {
      opacity: 0;
      transform: translate(0, 0) scale(0.3) rotate(0deg);
    }
    15% {
      opacity: 1;
      transform: translate(var(--dx1), var(--dy1)) scale(1) rotate(var(--r1));
    }
    70% {
      opacity: 0.8;
    }
    100% {
      opacity: 0;
      transform: translate(var(--dx2), var(--dy2)) scale(0.4) rotate(var(--r2));
    }
  }

  /* Статус голосового ввода */
  .voice-status {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(225, 6, 0, 0.95);
    color: #fff;
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(225, 6, 0, 0.6);
  }

  .voice-status.show {
    opacity: 1;
  }

  .voice-status .dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }

  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }

  @media (max-width: 480px) {
    .logo { font-size: 42px; letter-spacing: 4px; }
    .section-title { font-size: 18px; }
    body { padding: 15px 14px 140px 14px; }
    .btn { padding: 12px 14px; font-size: 12px; }
    .lips-fab { font-size: 70px; bottom: 20px; right: 15px; }
  }
</style>
</head>
<body>

  <h1 class="logo lux-text">PRIVÉ</h1>
  <p class="subtitle">Personal Secretary</p>

  <h2 class="section-title lux-text">СЕГОДНЯ</h2>

  <div class="input-wrap">
    <div class="row">
      <input type="text" id="taskInput" placeholder="Надиктуй или напиши задачу...">
    </div>
    <div class="row">
      <button class="btn btn-full" id="addBtn">Добавить</button>
      <button class="voice-btn" id="voiceBtn" title="Диктовка">🎙</button>
    </div>
  </div>

  <ul class="task-list" id="todayList"></ul>

  <h2 class="section-title lux-text">ДРУГИЕ ЗАДАЧИ</h2>
  <ul class="task-list" id="otherList"></ul>

  <!-- Статус голосового ввода -->
  <div class="voice-status" id="voiceStatus">
    <span id="voiceStatusText">Слушаю</span><span class="dots"></span>
  </div>

  <!-- Губы в правом нижнем углу -->
  <div class="lips-fab" id="lipsFab">💋</div>

<script>
  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  const lipsFab = document.getElementById('lipsFab');
  const todayList = document.getElementById('todayList');
  const otherList = document.getElementById('otherList');
  const voiceStatus = document.getElementById('voiceStatus');
  const voiceStatusText = document.getElementById('voiceStatusText');

  let tasks = JSON.parse(localStorage.getItem('priveTasks') || '[]');
  let isRecording = false;
  let recognition = null;

  const today = new Date().toISOString().split('T')[0];

  // === ЗВУКОВОЙ СИГНАЛ ===
  function beep(frequency = 800, duration = 150, volume = 0.3) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = frequency;
      osc.type = 'sine';
      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration / 1000);
    } catch(e) {}
  }

  // === ВИБРАЦИЯ ===
  function vibrate(pattern) {
    if (navigator.vibrate) {
      navigator.vibrate(pattern);
    }
  }

  // === ГЕНЕРАЦИЯ ЛЕТАЮЩИХ СЕРДЕЧЕК И ГУБОК ===
  function spawnFloater(type) {
    const el = document.createElement('div');
    el.className = 'floater ' + type;
    el.textContent = type === 'heart' ? '♥' : '💋';

    // Начальная позиция — от губ (правый нижний угол)
    const startX = window.innerWidth - 60;
    const startY = window.innerHeight - 100;
    el.style.left = startX + 'px';
    el.style.top = startY + 'px';

    // Случайные параметры траектории
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.2; // вверх с разбросом
    const distance = 200 + Math.random() * 400;
    const dx1 = Math.cos(angle) * distance * 0.3;
    const dy1 = Math.sin(angle) * distance * 0.3;
    const dx2 = Math.cos(angle) * distance + (Math.random() - 0.5) * 200;
    const dy2 = Math.sin(angle) * distance - 100;
    const r1 = (Math.random() - 0.5) * 60;
    const r2 = r1 + (Math.random() - 0.5) * 120;

    el.style.setProperty('--dx1', dx1 + 'px');
    el.style.setProperty('--dy1', dy1 + 'px');
    el.style.setProperty('--dx2', dx2 + 'px');
    el.style.setProperty('--dy2', dy2 + 'px');
    el.style.setProperty('--r1', r1 + 'deg');
    el.style.setProperty('--r2', r2 + 'deg');

    const duration = 3 + Math.random() * 2.5; // 3-5.5 секунд
    el.style.animation = `floatUp ${duration}s ease-out forwards`;
    el.style.fontSize = (20 + Math.random() * 20) + 'px';

    document.body.appendChild(el);

    setTimeout(() => {
      el.remove();
    }, duration * 1000);
  }

  // Запуск фонтана сердечек и губок
  function launchKissBurst() {
    const count = 6 + Math.floor(Math.random() * 4); // 6-9 штук
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        spawnFloater(Math.random() > 0.5 ? 'heart' : 'kiss');
      }, i * 150);
    }
  }

  // Постоянный фоновый фонтан (раз в 4 секунды)
  setInterval(() => {
    if (!isRecording) {
      spawnFloater(Math.random() > 0.5 ? 'heart' : 'kiss');
    }
  }, 4000);

  // Клик по губам — тоже запускает фонтан
  lipsFab.addEventListener('click', () => {
    launchKissBurst();
    vibrate(50);
  });

  // === РАСПОЗНАВАНИЕ ДАТ ИЗ РЕЧИ ===
  function parseDateFromText(text) {
    const lower = text.toLowerCase();
    const now = new Date();
    const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    // "завтра"
    if (lower.includes('завтра')) {
      const d = new Date(todayDate);
      d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    }

    // "послезавтра"
    if (lower.includes('послезавтра')) {
      const d = new Date(todayDate);
      d.setDate(d.getDate() + 2);
      return d.toISOString().split('T')[0];
    }

    // "через N дней"
    const daysMatch = lower.match(/через\s+(\d+)\s+дн/);
    if (daysMatch) {
      const d = new Date(todayDate);
      d.setDate(d.getDate() + parseInt(daysMatch[1]));
      return d.toISOString().split('T')[0];
    }

    // Дни недели
    const days = {
      'понедельник': 1, 'вторник': 2, 'среда': 3, 'среду': 3,
      'четверг': 4, 'пятница': 5, 'пятницу': 5,
      'суббота': 6, 'воскресенье': 0, 'воскресение': 0
    };

    for (const [word, dayNum] of Object.entries(days)) {
      if (lower.includes(word)) {
        const d = new Date(todayDate);
        const currentDay = d.getDay();
        let daysUntil = dayNum - currentDay;
        if (daysUntil <= 0) daysUntil += 7;
        d.setDate(d.getDate() + daysUntil);
        return d.toISOString().split('T')[0];
      }
    }

    // "сегодня", "без даты", "на сегодня" — сегодня
    if (lower.includes('сегодня') || lower.includes('без даты') || lower.includes('на сегодня')) {
      return today;
    }

    // По умолчанию — сегодня
    return today;
  }

  // Очистка текста от датных слов
  function cleanTaskText(text) {
    const lower = text.toLowerCase();
    const wordsToRemove = ['завтра', 'послезавтра', 'сегодня', 'без даты', 'на сегодня'];
    const daysWords = ['в понедельник', 'во вторник', 'в среду', 'в четверг', 'в пятницу', 'в субботу', 'в воскресенье',
                       'понедельник', 'вторник', 'среду', 'четверг', 'пятницу', 'субботу', 'воскресенье'];

    let cleaned = text;
    wordsToRemove.forEach(w => {
      cleaned = cleaned.replace(new RegExp(w, 'gi'), '');
    });
    daysWords.forEach(w => {
      cleaned = cleaned.replace(new RegExp(w, 'gi'), '');
    });
    cleaned = cleaned.replace(/через\s+\d+\s+дн[яей]?\s*/gi, '');

    // Убираем лишние пробелы и запятые в начале/конце
    cleaned = cleaned.replace(/^\s*[,\s]+|[,\s]+$/g, '').trim();
    return cleaned || text;
  }

  // === ДОБАВЛЕНИЕ ЗАДАЧИ ===
  function addTask(text, customDate) {
    const value = typeof text === 'string' ? text : taskInput.value.trim();
    if (!value) return;

    const date = customDate || parseDateFromText(value);
    const cleanText = customDate ? value : cleanTaskText(value);

    tasks.push({
      text: cleanText,
      date: date,
      done: false,
      id: Date.now()
    });
    taskInput.value = '';
    save();

    // Голосовое подтверждение
    speak('Добавлено: ' + cleanText);
  }

  // === СИНТЕЗ РЕЧИ ===
  function speak(text) {
    if ('speechSynthesis' in window) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ru-RU';
      utter.rate = 1.1;
      utter.pitch = 1;
      window.speechSynthesis.speak(utter);
    }
  }

  function save() {
    localStorage.setItem('priveTasks', JSON.stringify(tasks));
    render();
  }

  function render() {
    todayList.innerHTML = '';
    otherList.innerHTML = '';

    const todayTasks = tasks.filter(t => t.date === today || !t.date);
    const otherTasks = tasks.filter(t => t.date && t.date !== today)
                            .sort((a, b) => a.date.localeCompare(b.date));

    if (todayTasks.length === 0) {
      todayList.innerHTML = '<li class="empty">Пока пусто. Надиктуй первую задачу</li>';
    } else {
      todayTasks.forEach((t, i) => {
        todayList.appendChild(createTaskEl(t, tasks.indexOf(t), true));
      });
    }

    if (otherTasks.length === 0) {
      otherList.innerHTML = '<li class="empty">Нет запланированных задач</li>';
    } else {
      otherTasks.forEach(t => {
        otherList.appendChild(createTaskEl(t, tasks.indexOf(t), false));
      });
    }
  }

  function createTaskEl(t, idx, isUrgent) {
    const li = document.createElement('li');
    li.className = 'task' + (isUrgent ? ' urgent' : '') + (t.done ? ' done' : '');

    const span = document.createElement('span');
    span.className = 'task-text';
    span.textContent = t.text;

    const date = document.createElement('span');
    date.className = 'task-date';
    date.textContent = t.date ? formatDate(t.date) : 'сегодня';

    const check = document.createElement('button');
    check.className = 'task-btn';
    check.textContent = t.done ? '↩' : '✓';
    check.onclick = () => { tasks[idx].done = !tasks[idx].done; save(); };

    const del = document.createElement('button');
    del.className = 'task-btn del';
    del.textContent = '×';
    del.onclick = () => { tasks.splice(idx, 1); save(); };

    li.append(span, date, check, del);
    return li;
  }

  function formatDate(d) {
    const date = new Date(d);
    const opts = { day: 'numeric', month: 'short' };
    return date.toLocaleDateString('ru-RU', opts);
  }

  // === ГОЛОСОВОЙ ВВОД ===
  function showStatus(text) {
    voiceStatusText.textContent = text;
    voiceStatus.classList.add('show');
  }

  function hideStatus() {
    voiceStatus.classList.remove('show');
  }

  function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      showStatus('Голосовой ввод не поддерживается');
      setTimeout(hideStatus, 2000);
      return;
    }

    recognition = new SR();
    recognition.lang = 'ru-RU';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isRecording = true;
      voiceBtn.classList.add('recording');
      voiceBtn.textContent = '⏹';
      showStatus('Слушаю');
      vibrate([50, 30, 50]);
      beep(880, 200, 0.3);
    };

    recognition.onresult = e => {
      const text = e.results[0][0].transcript;
      taskInput.value = text;
      stopVoice();
      showStatus('Распознано');
      setTimeout(() => {
        addTask(text);
        launchKissBurst();
        hideStatus();
      }, 600);
    };

    recognition.onerror = e => {
      console.error('Speech error:', e.error);
      showStatus('Ошибка: ' + e.error);
      stopVoice();
      setTimeout(hideStatus, 2000);
    };

    recognition.onend = () => {
      if (isRecording) {
        // iOS иногда закрывает recognition сразу — перезапускаем
        try { recognition.start(); } catch(e) { stopVoice(); }
      }
    };

    try {
      recognition.start();
    } catch(e) {
      showStatus('Не удалось запустить микрофон');
      setTimeout(hideStatus, 2000);
    }
  }

  function stopVoice() {
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
    isRecording = false;
    voiceBtn.classList.remove('recording');
    voiceBtn.textContent = '🎙';
    vibrate(100);
    beep(440, 200, 0.3);
  }

  addBtn.addEventListener('click', () => {
    addTask();
    launchKissBurst();
  });

  voiceBtn.addEventListener('click', () => {
    if (isRecording) stopVoice();
    else startVoice();
  });

  taskInput.addEventListener('keypress', e => {
    if (e.key === 'Enter') {
      addTask();
      launchKissBurst();
    }
  });

  render();
</script>
</body>
</html>
