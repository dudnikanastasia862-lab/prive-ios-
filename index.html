<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PRIVÉ">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>PRIVÉ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:wght@500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #0a0a0a;
    color: #f5e6d3;
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    padding: 20px 18px 140px 18px;
    max-width: 600px;
    margin: 0 auto;
  }

  /* === 3D МОЛОЧНЫЙ ТЕКСТ С ПЕРЕЛИВАЮЩЕЙСЯ ЗОЛОТОЙ ОКАНТОВКОЙ === */
  .lux-text {
    font-family: 'Playfair Display', 'Didot', 'Bodoni MT', serif;
    color: transparent;
    background: linear-gradient(
      90deg,
      #D4AF37 0%,
      #FFF8DC 20%,
      #FFD700 40%,
      #FFF8DC 60%,
      #D4AF37 80%,
      #FFF8DC 100%
    );
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite;
    /* 3D объём через тени */
    text-shadow:
      0 1px 0 #e8d5b7,
      0 2px 0 #d4b896,
      0 3px 0 #b89968,
      0 4px 8px rgba(0,0,0,0.8);
    /* Золотая окантовка */
    -webkit-text-stroke: 0.5px #D4AF37;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* === ЗАГОЛОВОК === */
  .logo {
    text-align: center;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 8px;
  }

  .subtitle {
    text-align: center;
    font-size: 14px;
    letter-spacing: 4px;
    color: #D4AF37;
    margin-bottom: 30px;
    font-style: italic;
  }

  /* === СЕКЦИИ === */
  .section-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    margin: 25px 0 15px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.4);
  }

  /* === ВВОД === */
  .input-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 10px;
  }

  .row {
    display: flex;
    gap: 8px;
  }

  input[type="text"], input[type="date"] {
    flex: 1;
    padding: 14px 12px;
    background: rgba(26, 26, 26, 0.8);
    border: 1px solid #D4AF37;
    color: #f5e6d3;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    border-radius: 4px;
    outline: none;
    min-width: 0;
  }

  input[type="text"]::placeholder { color: #8a7a5a; }

  input:focus {
    border-color: #FFD700;
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
  }

  /* === КНОПКИ === */
  .btn {
    background: #E10600;
    color: #fff;
    border: none;
    padding: 14px 18px;
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
  }

  .btn:hover, .btn:active {
    background: #FFD700;
    color: #0a0a0a;
    transform: translateY(-1px);
  }

  .btn-full { width: 100%; }

  .voice-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    padding: 0;
    font-size: 22px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #E10600;
    box-shadow: 0 0 0 0 rgba(225, 6, 0, 0.7);
  }

  .voice-btn.recording {
    animation: pulse-red 1.4s infinite;
  }

  @keyframes pulse-red {
    0% { box-shadow: 0 0 0 0 rgba(225, 6, 0, 0.8); }
    70% { box-shadow: 0 0 0 18px rgba(225, 6, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(225, 6, 0, 0); }
  }

  /* === ЗАДАЧИ === */
  .task-list { list-style: none; }

  .task {
    background: rgba(26, 26, 26, 0.7);
    border: 1px solid #D4AF37;
    border-left: 3px solid #D4AF37;
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideIn 0.3s ease;
  }

  .task.urgent {
    border-color: #E10600;
    border-left: 3px solid #E10600;
    background: rgba(40, 10, 10, 0.6);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .task-text {
    flex: 1;
    font-size: 16px;
    color: #f5e6d3;
    word-break: break-word;
  }

  .task.done .task-text {
    text-decoration: line-through;
    opacity: 0.5;
  }

  .task-date {
    font-size: 12px;
    color: #D4AF37;
    white-space: nowrap;
    font-style: italic;
  }

  .task-btn {
    background: transparent;
    border: 1px solid #D4AF37;
    color: #D4AF37;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    padding: 0;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .task-btn:hover {
    background: #D4AF37;
    color: #0a0a0a;
  }

  .task-btn.del {
    border-color: #E10600;
    color: #E10600;
  }

  .task-btn.del:hover {
    background: #E10600;
    color: #fff;
  }

  .empty {
    text-align: center;
    color: #5a4a2a;
    font-style: italic;
    padding: 20px;
    font-size: 14px;
  }

  /* === АНИМАЦИЯ ГУБ ВНИЗУ === */
  .lips-container {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
    background: linear-gradient(to top, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0) 100%);
  }

  .lips {
    width: 100px;
    height: 60px;
    position: relative;
    animation: kiss 2.5s ease-in-out infinite;
    filter: drop-shadow(0 4px 15px rgba(225, 6, 0, 0.6));
  }

  .lips svg {
    width: 100%;
    height: 100%;
  }

  @keyframes kiss {
    0%, 100% {
      transform: scale(1);
    }
    20% {
      transform: scale(1.15);
    }
    40% {
      transform: scale(0.75);
    }
    60% {
      transform: scale(1.05);
    }
    80% {
      transform: scale(0.95);
    }
  }

  /* Блеск на губах */
  .lips::after {
    content: '';
    position: absolute;
    top: 15%;
    left: 20%;
    width: 25%;
    height: 20%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.7) 0%, transparent 70%);
    border-radius: 50%;
    animation: gloss 2.5s ease-in-out infinite;
  }

  @keyframes gloss {
    0%, 100% { opacity: 0.5; }
    40% { opacity: 1; }
  }

  /* Сердечко при "чмоке" */
  .heart {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    color: #E10600;
    opacity: 0;
    animation: heartFloat 2.5s ease-in-out infinite;
  }

  @keyframes heartFloat {
    0%, 35%, 100% { opacity: 0; transform: translate(-50%, 0) scale(0.3); }
    40% { opacity: 1; transform: translate(-50%, -15px) scale(1.2); }
    70% { opacity: 0; transform: translate(-50%, -40px) scale(0.6); }
  }

  /* === АДАПТИВ === */
  @media (max-width: 480px) {
    .logo { font-size: 42px; letter-spacing: 4px; }
    .section-title { font-size: 18px; }
    body { padding: 15px 14px 130px 14px; }
    .btn { padding: 12px 14px; font-size: 12px; }
  }
</style>
</head>
<body>

  <h1 class="logo lux-text">PRIVÉ</h1>
  <p class="subtitle">Personal Secretary</p>

  <h2 class="section-title lux-text">СЕГОДНЯ</h2>

  <div class="input-wrap">
    <div class="row">
      <input type="text" id="taskInput" placeholder="Надиктуй или напиши задачу...">
    </div>
    <div class="row">
      <input type="date" id="dateInput">
      <button class="btn btn-full" id="addBtn">Добавить</button>
      <button class="voice-btn" id="voiceBtn" title="Диктовка"></button>
    </div>
  </div>

  <ul class="task-list" id="todayList"></ul>

  <h2 class="section-title lux-text">ДРУГИЕ ЗАДАЧИ</h2>
  <ul class="task-list" id="otherList"></ul>

  <!-- Анимация губ внизу -->
  <div class="lips-container">
    <div class="lips">
      <span class="heart">♥</span>
      <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="lipGrad" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#ff2a3a"/>
            <stop offset="50%" stop-color="#E10600"/>
            <stop offset="100%" stop-color="#8b0000"/>
          </radialGradient>
        </defs>
        <!-- Верхняя губа -->
        <path d="M 10 30 Q 25 10 40 22 Q 50 15 60 22 Q 75 10 90 30 Q 75 25 50 28 Q 25 25 10 30 Z"
              fill="url(#lipGrad)" stroke="#5a0000" stroke-width="0.5"/>
        <!-- Нижняя губа -->
        <path d="M 10 30 Q 25 55 50 55 Q 75 55 90 30 Q 75 35 50 33 Q 25 35 10 30 Z"
              fill="url(#lipGrad)" stroke="#5a0000" stroke-width="0.5"/>
        <!-- Линия между губами -->
        <path d="M 12 30 Q 30 32 50 30 Q 70 32 88 30"
              fill="none" stroke="#3a0000" stroke-width="1.2"/>
      </svg>
    </div>
  </div>

<script>
  const taskInput = document.getElementById('taskInput');
  const dateInput = document.getElementById('dateInput');
  const addBtn = document.getElementById('addBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  const todayList = document.getElementById('todayList');
  const otherList = document.getElementById('otherList');

  let tasks = JSON.parse(localStorage.getItem('priveTasks') || '[]');
  let isRecording = false;
  let recognition = null;

  const today = new Date().toISOString().split('T')[0];
  dateInput.value = today;

  function save() {
    localStorage.setItem('priveTasks', JSON.stringify(tasks));
    render();
  }

  function render() {
    todayList.innerHTML = '';
    otherList.innerHTML = '';

    const todayTasks = tasks.filter(t => t.date === today || !t.date);
    const otherTasks = tasks.filter(t => t.date && t.date !== today)
                            .sort((a, b) => a.date.localeCompare(b.date));

    if (todayTasks.length === 0) {
      todayList.innerHTML = '<li class="empty">Пока пусто. Надиктуй первую задачу</li>';
    } else {
      todayTasks.forEach((t, i) => {
        todayList.appendChild(createTaskEl(t, tasks.indexOf(t), true));
      });
    }

    if (otherTasks.length === 0) {
      otherList.innerHTML = '<li class="empty">Нет запланированных задач</li>';
    } else {
      otherTasks.forEach(t => {
        otherList.appendChild(createTaskEl(t, tasks.indexOf(t), false));
      });
    }
  }

  function createTaskEl(t, idx, isUrgent) {
    const li = document.createElement('li');
    li.className = 'task' + (isUrgent ? ' urgent' : '') + (t.done ? ' done' : '');

    const span = document.createElement('span');
    span.className = 'task-text';
    span.textContent = t.text;

    const date = document.createElement('span');
    date.className = 'task-date';
    date.textContent = t.date ? formatDate(t.date) : 'сегодня';

    const check = document.createElement('button');
    check.className = 'task-btn';
    check.textContent = t.done ? '↩' : '✓';
    check.onclick = () => { tasks[idx].done = !tasks[idx].done; save(); };

    const del = document.createElement('button');
    del.className = 'task-btn del';
    del.textContent = '×';
    del.onclick = () => { tasks.splice(idx, 1); save(); };

    li.append(span, date, check, del);
    return li;
  }

  function formatDate(d) {
    const date = new Date(d);
    const opts = { day: 'numeric', month: 'short' };
    return date.toLocaleDateString('ru-RU', opts);
  }

  function addTask(text) {
    const value = typeof text === 'string' ? text : taskInput.value.trim();
    if (!value) return;
    tasks.push({
      text: value,
      date: dateInput.value || today,
      done: false,
      id: Date.now()
    });
    taskInput.value = '';
    save();
  }

  function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      alert('Голосовой ввод не поддерживается в этом браузере. Используй Safari.');
      return;
    }
    if (!recognition) {
      recognition = new SR();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.onresult = e => {
        const text = e.results[0][0].transcript;
        taskInput.value = text;
        stopVoice();
        setTimeout(() => {
          if (taskInput.value === text) addTask(text);
        }, 1200);
      };
      recognition.onerror = e => {
        console.error(e.error);
        stopVoice();
      };
      recognition.onend = () => stopVoice();
    }
    recognition.start();
    isRecording = true;
    voiceBtn.classList.add('recording');
    voiceBtn.textContent = '⏹';
  }

  function stopVoice() {
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
    isRecording = false;
    voiceBtn.classList.remove('recording');
    voiceBtn.textContent = '🎙';
  }

  addBtn.addEventListener('click', () => addTask());
  voiceBtn.addEventListener('click', () => {
    if (isRecording) stopVoice();
    else startVoice();
  });

  taskInput.addEventListener('keypress', e => {
    if (e.key === 'Enter') addTask();
  });

  render();
</script>
</body>
</html>
