<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PRIVÉ">
<link rel="apple-touch-icon" href="icon.PNG?v=3">
<link rel="icon" href="icon.PNG?v=3">
<title>PRIVÉ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:wght@500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #0a0a0a;
    color: #f5e6d3;
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    padding: 20px 18px 100px 18px;
    max-width: 600px;
    margin: 0 auto;
  }

  /* === 3D ЗОЛОТОЙ ТЕКСТ === */
  .lux-text {
    font-family: 'Playfair Display', 'Didot', 'Bodoni MT', serif;
    color: #f5e6d3;
    background: linear-gradient(90deg, #D4AF37 0%, #FFF8DC 20%, #FFD700 40%, #FFF8DC 60%, #D4AF37 80%, #FFF8DC 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite;
    text-shadow:
      0 1px 0 #e8d5b7,
      0 2px 0 #d4b896,
      0 3px 0 #b89968,
      0 4px 8px rgba(0,0,0,0.8);
    -webkit-text-stroke: 0.3px #D4AF37;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .logo {
    text-align: center;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 8px;
    animation: logoFloat 3s ease-in-out infinite;
  }

  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .subtitle {
    text-align: center;
    font-size: 14px;
    letter-spacing: 4px;
    color: #D4AF37;
    margin-bottom: 30px;
    font-style: italic;
  }

  .section-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    margin: 25px 0 15px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.4);
  }

  /* === КАРТОЧКИ КАТЕГОРИЙ === */
  .categories-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 20px;
  }

  .category-card {
    background: linear-gradient(135deg, rgba(26, 26, 26, 0.9) 0%, rgba(40, 30, 20, 0.8) 100%);
    border: 2px solid #D4AF37;
    border-radius: 8px;
    padding: 20px 15px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    animation: cardAppear 0.5s ease-out;
  }

  @keyframes cardAppear {
    from {
      opacity: 0;
      transform: translateY(20px) scale(0.9);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .category-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .category-card:hover::before,
  .category-card:active::before {
    opacity: 1;
  }

  .category-card:hover,
  .category-card:active {
    transform: translateY(-5px) scale(1.02);
    border-color: #FFD700;
    box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
  }

  .category-name {
    font-size: 18px;
    font-weight: 700;
    color: #f5e6d3;
    margin-bottom: 8px;
    word-break: break-word;
  }

  .category-count {
    font-size: 12px;
    color: #D4AF37;
    font-style: italic;
  }

  .category-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    background: transparent;
    border: 1px solid #E10600;
    color: #E10600;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    padding: 0;
    font-size: 12px;
    cursor: pointer;
    opacity: 0.6;
    transition: all 0.3s ease;
  }

  .category-delete:hover {
    opacity: 1;
    background: #E10600;
    color: #fff;
  }

  .add-category-btn {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(255, 215, 0, 0.1) 100%);
    border: 2px dashed #D4AF37;
    border-radius: 8px;
    padding: 20px 15px;
    cursor: pointer;
    transition: all 0.4s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: #D4AF37;
  }

  .add-category-btn:hover {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.3) 0%, rgba(255, 215, 0, 0.2) 100%);
    border-color: #FFD700;
    transform: scale(1.05);
  }

  /* === СПИСОК ТОВАРОВ === */
  .items-list {
    list-style: none;
    margin-bottom: 20px;
  }

  .item {
    background: rgba(26, 26, 26, 0.8);
    border: 1px solid #D4AF37;
    border-left: 4px solid #D4AF37;
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    animation: itemSlideIn 0.4s ease-out;
    position: relative;
    overflow: hidden;
  }

  @keyframes itemSlideIn {
    from {
      opacity: 0;
      transform: translateX(-30px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  .item:hover {
    transform: translateX(5px);
    border-color: #FFD700;
    box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
  }

  .item.out-of-stock {
    border-left-color: #E10600;
    background: rgba(40, 10, 10, 0.6);
    opacity: 0.7;
  }

  .item.out-of-stock .item-name {
    text-decoration: line-through;
    color: #8a7a5a;
  }

  .item-name {
    flex: 1;
    font-size: 16px;
    color: #f5e6d3;
    word-break: break-word;
    transition: all 0.3s ease;
  }

  .item-delete {
    background: transparent;
    border: 1px solid #E10600;
    color: #E10600;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    padding: 0;
    font-size: 14px;
    cursor: pointer;
    opacity: 0.6;
    transition: all 0.3s ease;
    flex-shrink: 0;
  }

  .item-delete:hover {
    opacity: 1;
    background: #E10600;
    color: #fff;
  }

  .empty {
    text-align: center;
    color: #5a4a2a;
    font-style: italic;
    padding: 30px 20px;
    font-size: 16px;
  }

  /* === ФОРМА ДОБАВЛЕНИЯ === */
  .input-wrap {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  input[type="text"] {
    flex: 1;
    padding: 14px 16px;
    background: rgba(26, 26, 26, 0.8);
    border: 1px solid #D4AF37;
    color: #f5e6d3;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    border-radius: 6px;
    outline: none;
    transition: all 0.3s ease;
  }

  input[type="text"]::placeholder { color: #8a7a5a; }

  input[type="text"]:focus {
    border-color: #FFD700;
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
  }

  .btn {
    background: linear-gradient(135deg, #E10600 0%, #c00500 100%);
    color: #fff;
    border: none;
    padding: 14px 20px;
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    box-shadow: 0 4px 15px rgba(225, 6, 0, 0.3);
  }

  .btn:hover {
    background: linear-gradient(135deg, #FFD700 0%, #D4AF37 100%);
    color: #0a0a0a;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
  }

  .btn:active {
    transform: translateY(0);
  }

  .back-btn {
    background: transparent;
    border: 1px solid #D4AF37;
    color: #D4AF37;
    padding: 10px 18px;
    border-radius: 6px;
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 20px;
    transition: all 0.3s ease;
  }

  .back-btn:hover {
    background: #D4AF37;
    color: #0a0a0a;
  }

  /* === КНОПКИ БЭКАПА === */
  .backup-section {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(10, 10, 10, 0.98);
    border-top: 1px solid rgba(212, 175, 55, 0.4);
    padding: 12px 18px;
    display: flex;
    gap: 10px;
    z-index: 100;
  }

  .backup-btn {
    flex: 1;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(255, 215, 0, 0.1) 100%);
    border: 1px solid #D4AF37;
    color: #D4AF37;
    padding: 10px;
    border-radius: 6px;
    font-family: 'Playfair Display', serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
  }

  .backup-btn:hover {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.3) 0%, rgba(255, 215, 0, 0.2) 100%);
    border-color: #FFD700;
    transform: translateY(-2px);
  }

  /* === МОДАЛКА БЭКАПА === */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.3s ease;
  }

  .modal-overlay.show {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: linear-gradient(135deg, #1a1a1a 0%, #2a1f15 100%);
    border: 2px solid #D4AF37;
    border-radius: 12px;
    padding: 30px;
    max-width: 400px;
    width: 90%;
    text-align: center;
    animation: modalAppear 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes modalAppear {
    from {
      opacity: 0;
      transform: scale(0.8) translateY(30px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  .modal-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 15px;
  }

  .modal-text {
    font-size: 16px;
    margin-bottom: 25px;
    line-height: 1.5;
  }

  .modal-btns {
    display: flex;
    gap: 10px;
  }

  .modal-btn {
    flex: 1;
    padding: 12px;
    border-radius: 6px;
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .modal-btn.primary {
    background: linear-gradient(135deg, #D4AF37 0%, #FFD700 100%);
    color: #0a0a0a;
    border: none;
  }

  .modal-btn.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
  }

  .modal-btn.secondary {
    background: transparent;
    border: 1px solid #D4AF37;
    color: #D4AF37;
  }

  .modal-btn.secondary:hover {
    background: rgba(212, 175, 55, 0.1);
  }

  .hidden { display: none; }

  @media (max-width: 480px) {
    .logo { font-size: 42px; letter-spacing: 4px; }
    .section-title { font-size: 18px; }
    body { padding: 15px 14px 100px 14px; }
    .categories-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <h1 class="logo lux-text">PRIVÉ</h1>
  <p class="subtitle">Personal Secretary</p>

  <!-- ЭКРАН КАТЕГОРИЙ -->
  <div id="categoriesScreen">
    <h2 class="section-title lux-text">КАТЕГОРИИ</h2>
    <div class="categories-grid" id="categoriesGrid"></div>
  </div>

  <!-- ЭКРАН СПИСКА ТОВАРОВ -->
  <div id="itemsScreen" class="hidden">
    <button class="back-btn" id="backBtn">← Назад к категориям</button>
    <h2 class="section-title lux-text" id="categoryTitle"></h2>

    <div class="input-wrap">
      <input type="text" id="itemInput" placeholder="Название товара...">
      <button class="btn" id="addItemBtn">+</button>
    </div>

    <h3 class="section-title lux-text" style="font-size: 18px;">ЗАКОНЧИЛОСЬ</h3>
    <ul class="items-list" id="outOfStockList"></ul>

    <h3 class="section-title lux-text" style="font-size: 18px;">В НАЛИЧИИ</h3>
    <ul class="items-list" id="inStockList"></ul>
  </div>

  <!-- КНОПКИ БЭКАПА -->
  <div class="backup-section">
    <button class="backup-btn" id="restoreBtn">Восстановить копию</button>
  </div>

  <!-- МОДАЛКА БЭКАПА -->
  <div class="modal-overlay" id="backupModal">
    <div class="modal">
      <h3 class="modal-title lux-text">РЕЗЕРВНАЯ КОПИЯ</h3>
      <p class="modal-text">Прошло больше суток с последнего бэкапа. Сохраните данные, чтобы не потерять их.</p>
      <div class="modal-btns">
        <button class="modal-btn primary" id="downloadBackupBtn">Скачать бэкап</button>
        <button class="modal-btn secondary" id="skipBackupBtn">Позже</button>
      </div>
    </div>
  </div>

  <!-- СКРЫТЫЙ INPUT ДЛЯ ЗАГРУЗКИ -->
  <input type="file" id="fileInput" accept=".json" style="display: none;">

<script>
  // === INDEXEDDB ===
  const DB_NAME = 'prive_db';
  const DB_VERSION = 1;
  let db;

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      
      request.onerror = () => reject(request.error);
      request.onsuccess = () => {
        db = request.result;
        resolve(db);
      };
      
      request.onupgradeneeded = (event) => {
        const database = event.target.result;
        
        if (!database.objectStoreNames.contains('categories')) {
          database.createObjectStore('categories', { keyPath: 'id', autoIncrement: true });
        }
        
        if (!database.objectStoreNames.contains('items')) {
          const itemStore = database.createObjectStore('items', { keyPath: 'id', autoIncrement: true });
          itemStore.createIndex('categoryId', 'categoryId', { unique: false });
        }
        
        if (!database.objectStoreNames.contains('settings')) {
          database.createObjectStore('settings', { keyPath: 'key' });
        }
      };
    });
  }

  function dbGetAll(storeName) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(storeName, 'readonly');
      const store = transaction.objectStore(storeName);
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function dbAdd(storeName, data) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(storeName, 'readwrite');
      const store = transaction.objectStore(storeName);
      const request = store.add(data);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function dbUpdate(storeName, data) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(storeName, 'readwrite');
      const store = transaction.objectStore(storeName);
      const request = store.put(data);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function dbDelete(storeName, id) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(storeName, 'readwrite');
      const store = transaction.objectStore(storeName);
      const request = store.delete(id);
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  function dbGetByIndex(storeName, indexName, value) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(storeName, 'readonly');
      const store = transaction.objectStore(storeName);
      const index = store.index(indexName);
      const request = index.getAll(value);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function dbGetSetting(key) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction('settings', 'readonly');
      const store = transaction.objectStore('settings');
      const request = store.get(key);
      request.onsuccess = () => resolve(request.result?.value);
      request.onerror = () => reject(request.error);
    });
  }

  function dbSetSetting(key, value) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction('settings', 'readwrite');
      const store = transaction.objectStore('settings');
      const request = store.put({ key, value });
      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  // === ИНИЦИАЛИЗАЦИЯ ===
  let categories = [];
  let items = [];
  let currentCategoryId = null;

  async function init() {
    await openDB();
    await loadData();
    await checkBackup();
    renderCategories();
  }

  async function loadData() {
    categories = await dbGetAll('categories');
    items = await dbGetAll('items');
    
    if (categories.length === 0) {
      // Создаём стартовые категории
      const defaultCategories = ['Продукты', 'Бытовая химия', 'Автомобиль', 'Уют'];
      for (const name of defaultCategories) {
        await dbAdd('categories', { name });
      }
      categories = await dbGetAll('categories');
    }
  }

  async function checkBackup() {
    const lastBackup = await dbGetSetting('lastBackup');
    const now = Date.now();
    
    if (!lastBackup || (now - lastBackup) > 24 * 60 * 60 * 1000) {
      document.getElementById('backupModal').classList.add('show');
    }
  }

  // === РЕНДЕР КАТЕГОРИЙ ===
  function renderCategories() {
    const grid = document.getElementById('categoriesGrid');
    grid.innerHTML = '';
    
    categories.forEach(cat => {
      const catItems = items.filter(i => i.categoryId === cat.id);
      const inStock = catItems.filter(i => !i.outOfStock).length;
      
      const card = document.createElement('div');
      card.className = 'category-card';
      card.innerHTML = `
        <button class="category-delete" data-id="${cat.id}">×</button>
        <div class="category-name lux-text">${cat.name}</div>
        <div class="category-count">${inStock} в наличии</div>
      `;
      
      card.addEventListener('click', (e) => {
        if (e.target.classList.contains('category-delete')) {
          deleteCategory(cat.id);
        } else {
          openCategory(cat.id);
        }
      });
      
      grid.appendChild(card);
    });
    
    // Кнопка добавления категории
    const addBtn = document.createElement('div');
    addBtn.className = 'add-category-btn';
    addBtn.textContent = '+';
    addBtn.addEventListener('click', addCategory);
    grid.appendChild(addBtn);
  }

  async function addCategory() {
    const name = prompt('Название категории:');
    if (name && name.trim()) {
      await dbAdd('categories', { name: name.trim() });
      await loadData();
      renderCategories();
    }
  }

  async function deleteCategory(id) {
    if (confirm('Удалить категорию и все её товары?')) {
      await dbDelete('categories', id);
      const catItems = items.filter(i => i.categoryId === id);
      for (const item of catItems) {
        await dbDelete('items', item.id);
      }
      await loadData();
      renderCategories();
    }
  }

  // === РЕНДЕР ТОВАРОВ ===
  async function openCategory(id) {
    currentCategoryId = id;
    const category = categories.find(c => c.id === id);
    document.getElementById('categoryTitle').textContent = category.name;
    document.getElementById('categoriesScreen').classList.add('hidden');
    document.getElementById('itemsScreen').classList.remove('hidden');
    renderItems();
  }

  function closeCategory() {
    currentCategoryId = null;
    document.getElementById('itemsScreen').classList.add('hidden');
    document.getElementById('categoriesScreen').classList.remove('hidden');
    document.getElementById('itemInput').value = '';
    renderCategories();
  }

  function renderItems() {
    const catItems = items.filter(i => i.categoryId === currentCategoryId);
    const outOfStock = catItems.filter(i => i.outOfStock);
    const inStock = catItems.filter(i => !i.outOfStock);
    
    const outList = document.getElementById('outOfStockList');
    const inList = document.getElementById('inStockList');
    
    outList.innerHTML = '';
    inList.innerHTML = '';
    
    if (outOfStock.length === 0) {
      outList.innerHTML = '<li class="empty">Всё в наличии</li>';
    } else {
      outOfStock.forEach(item => {
        outList.appendChild(createItemEl(item));
      });
    }
    
    if (inStock.length === 0) {
      inList.innerHTML = '<li class="empty">Добавьте первый товар</li>';
    } else {
      inStock.forEach(item => {
        inList.appendChild(createItemEl(item));
      });
    }
  }

  function createItemEl(item) {
    const li = document.createElement('li');
    li.className = 'item' + (item.outOfStock ? ' out-of-stock' : '');
    li.innerHTML = `
      <span class="item-name">${item.name}</span>
      <button class="item-delete" data-id="${item.id}">×</button>
    `;
    
    li.addEventListener('click', (e) => {
      if (e.target.classList.contains('item-delete')) {
        deleteItem(item.id);
      } else {
        toggleItem(item.id);
      }
    });
    
    return li;
  }

  async function addItem() {
    const input = document.getElementById('itemInput');
    const name = input.value.trim();
    if (!name || !currentCategoryId) return;
    
    await dbAdd('items', {
      name,
      categoryId: currentCategoryId,
      outOfStock: false
    });
    
    input.value = '';
    await loadData();
    renderItems();
  }

  async function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (item) {
      item.outOfStock = !item.outOfStock;
      await dbUpdate('items', item);
      await loadData();
      renderItems();
    }
  }

  async function deleteItem(id) {
    await dbDelete('items', id);
    await loadData();
    renderItems();
  }

  // === БЭКАП ===
  async function downloadBackup() {
    const data = {
      categories: await dbGetAll('categories'),
      items: await dbGetAll('items'),
      timestamp: new Date().toISOString()
    };
    
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `prive_backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    
    await dbSetSetting('lastBackup', Date.now());
    document.getElementById('backupModal').classList.remove('show');
  }

  function restoreBackup() {
    document.getElementById('fileInput').click();
  }

  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = async (event) => {
      try {
        const data = JSON.parse(event.target.result);
        
        if (data.categories && data.items) {
          // Очищаем текущие данные
          const allCategories = await dbGetAll('categories');
          for (const cat of allCategories) {
            await dbDelete('categories', cat.id);
          }
          
          const allItems = await dbGetAll('items');
          for (const item of allItems) {
            await dbDelete('items', item.id);
          }
          
          // Восстанавливаем
          for (const cat of data.categories) {
            await dbAdd('categories', { name: cat.name });
          }
          
          const newCategories = await dbGetAll('categories');
          const catMap = new Map();
          data.categories.forEach((oldCat, idx) => {
            catMap.set(oldCat.id, newCategories[idx].id);
          });
          
          for (const item of data.items) {
            await dbAdd('items', {
              name: item.name,
              categoryId: catMap.get(item.categoryId),
              outOfStock: item.outOfStock
            });
          }
          
          await dbSetSetting('lastBackup', Date.now());
          await loadData();
          renderCategories();
          alert('Данные восстановлены!');
        }
      } catch (err) {
        alert('Ошибка при восстановлении: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // === ОБРАБОТЧИКИ ===
  document.getElementById('backBtn').addEventListener('click', closeCategory);
  
  document.getElementById('addItemBtn').addEventListener('click', addItem);
  
  document.getElementById('itemInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addItem();
  });
  
  document.getElementById('downloadBackupBtn').addEventListener('click', downloadBackup);
  
  document.getElementById('skipBackupBtn').addEventListener('click', () => {
    document.getElementById('backupModal').classList.remove('show');
  });
  
  document.getElementById('restoreBtn').addEventListener('click', restoreBackup);

  // Запуск
  init();
</script>
</body>
</html>
