<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PRIVÉ">
<link rel="apple-touch-icon" href="icon.PNG?v=3">
<link rel="icon" href="icon.PNG?v=3">
<title>PRIVÉ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:wght@500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #0a0a0a;
    color: #f5e6d3;
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    padding: 20px 18px 180px 18px;
    max-width: 600px;
    margin: 0 auto;
  }

  .lux-text {
    font-family: 'Playfair Display', 'Didot', 'Bodoni MT', serif;
    color: #f5e6d3;
    background: linear-gradient(90deg, #D4AF37 0%, #FFF8DC 20%, #FFD700 40%, #FFF8DC 60%, #D4AF37 80%, #FFF8DC 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite;
    text-shadow: 0 1px 0 #e8d5b7, 0 2px 0 #d4b896, 0 3px 0 #b89968, 0 4px 8px rgba(0,0,0,0.8);
    -webkit-text-stroke: 0.3px #D4AF37;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .logo {
    text-align: center;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 6px;
    margin-bottom: 8px;
  }

  .subtitle {
    text-align: center;
    font-size: 14px;
    letter-spacing: 4px;
    color: #D4AF37;
    margin-bottom: 20px;
    font-style: italic;
  }

  .section-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    margin: 25px 0 15px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.4);
  }

  .input-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 10px;
  }

  .row {
    display: flex;
    gap: 8px;
  }

  input[type="text"] {
    flex: 1;
    padding: 14px 12px;
    background: rgba(26, 26, 26, 0.8);
    border: 1px solid #D4AF37;
    color: #f5e6d3;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    border-radius: 4px;
    outline: none;
    min-width: 0;
  }

  input[type="text"]::placeholder { color: #8a7a5a; }

  input:focus {
    border-color: #FFD700;
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
  }

  .btn {
    background: #E10600;
    color: #fff;
    border: none;
    padding: 14px 18px;
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
  }

  .btn:hover, .btn:active {
    background: #FFD700;
    color: #0a0a0a;
    transform: translateY(-1px);
  }

  .btn-full { width: 100%; }

  .voice-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    padding: 0;
    font-size: 26px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #E10600;
    border: 2px solid #fff;
    box-shadow: 0 0 0 0 rgba(225, 6, 0, 0.7);
  }

  .voice-btn.recording {
    animation: pulse-red 1.2s infinite;
    background: #ff2a2a;
  }

  @keyframes pulse-red {
    0% { box-shadow: 0 0 0 0 rgba(225, 6, 0, 0.9); }
    70% { box-shadow: 0 0 0 20px rgba(225, 6, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(225, 6, 0, 0); }
  }

  .task-list, .list-list { list-style: none; }

  .task, .list-item {
    background: rgba(26, 26, 26, 0.7);
    border: 1px solid #D4AF37;
    border-left: 3px solid #D4AF37;
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideIn 0.3s ease;
  }

  .task.urgent {
    border-color: #E10600;
    border-left: 3px solid #E10600;
    background: rgba(40, 10, 10, 0.6);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .task-text, .list-text {
    flex: 1;
    font-size: 16px;
    color: #f5e6d3;
    word-break: break-word;
  }

  .task.done .task-text, .list-item.done .list-text {
    text-decoration: line-through;
    opacity: 0.5;
  }

  .task-date {
    font-size: 12px;
    color: #D4AF37;
    white-space: nowrap;
    font-style: italic;
  }

  .task-btn, .list-btn {
    background: transparent;
    border: 1px solid #D4AF37;
    color: #D4AF37;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    padding: 0;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .task-btn:hover, .list-btn:hover {
    background: #D4AF37;
    color: #0a0a0a;
  }

  .task-btn.del, .list-btn.del {
    border-color: #E10600;
    color: #E10600;
  }

  .task-btn.del:hover, .list-btn.del:hover {
    background: #E10600;
    color: #fff;
  }

  .empty {
    text-align: center;
    color: #5a4a2a;
    font-style: italic;
    padding: 20px;
    font-size: 14px;
  }

  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(10, 10, 10, 0.98);
    border-top: 1px solid rgba(212, 175, 55, 0.4);
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 12px 0;
    z-index: 90;
  }

  .tab-btn {
    background: transparent;
    border: none;
    color: #8a7a5a;
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    padding: 8px 16px;
    transition: all 0.3s ease;
    text-transform: uppercase;
  }

  .tab-btn.active {
    color: #D4AF37;
    border-bottom: 2px solid #D4AF37;
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  .lips-fab {
    position: fixed;
    bottom: 140px;
    right: -10px;
    font-size: 160px;
    line-height: 1;
    z-index: 100;
    transform: rotate(-28deg);
    transform-origin: center center;
    animation: kiss 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    filter: drop-shadow(0 8px 25px rgba(225, 6, 0, 0.9));
    cursor: pointer;
    pointer-events: auto;
    user-select: none;
    -webkit-user-select: none;
  }

  @keyframes kiss {
    0%, 100% { transform: rotate(-28deg) scale(1); }
    18% { transform: rotate(-28deg) scale(1.15); }
    38% { transform: rotate(-28deg) scale(0.6); }
    55% { transform: rotate(-28deg) scale(0.65); }
    75% { transform: rotate(-28deg) scale(1.08); }
  }

  .floater {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    font-size: 32px;
    will-change: transform, opacity;
  }

  .floater.heart { color: #E10600; text-shadow: 0 0 12px rgba(225, 6, 0, 0.9); }
  .floater.kiss { color: #ff2a3a; filter: drop-shadow(0 0 8px rgba(225, 6, 0, 0.7)); }

  @keyframes floatRandom {
    0% {
      opacity: 0;
      transform: translate(0, 0) scale(0.2) rotate(0deg);
    }
    10% {
      opacity: 1;
      transform: translate(var(--dx1), var(--dy1)) scale(1) rotate(var(--r1));
    }
    60% {
      opacity: 0.8;
    }
    100% {
      opacity: 0;
      transform: translate(var(--dx2), var(--dy2)) scale(0.3) rotate(var(--r2));
    }
  }

  .voice-status {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(225, 6, 0, 0.95);
    color: #fff;
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(225, 6, 0, 0.6);
  }

  .voice-status.show { opacity: 1; }

  .voice-status .dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }

  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }

  .list-card {
    background: rgba(26, 26, 26, 0.7);
    border: 1px solid #D4AF37;
    border-radius: 4px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }

  .list-card:hover {
    background: rgba(40, 30, 20, 0.8);
    transform: translateY(-2px);
  }

  .list-card-title {
    font-size: 18px;
    font-weight: 700;
    color: #f5e6d3;
    margin-bottom: 6px;
  }

  .list-card-count {
    font-size: 12px;
    color: #D4AF37;
    font-style: italic;
  }

  .list-detail {
    display: none;
  }

  .list-detail.active {
    display: block;
  }

  .back-btn {
    background: transparent;
    border: 1px solid #D4AF37;
    color: #D4AF37;
    padding: 8px 16px;
    border-radius: 4px;
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 15px;
  }

  .back-btn:hover {
    background: #D4AF37;
    color: #0a0a0a;
  }

  /* === ЗОЛОТЫЕ УКРАШЕНИЯ ВНИЗУ === */
  .jewelry-container {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 120px;
    pointer-events: none;
    z-index: 80;
    overflow: hidden;
  }

  .jewelry {
    position: absolute;
    font-size: 32px;
    filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
    animation: sparkle 2s ease-in-out infinite;
  }

  @keyframes sparkle {
    0%, 100% {
      opacity: 0.6;
      transform: scale(1) rotate(var(--rot));
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6));
    }
    50% {
      opacity: 1;
      transform: scale(1.15) rotate(var(--rot));
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 1));
    }
  }

  @media (max-width: 480px) {
    .logo { font-size: 42px; letter-spacing: 4px; }
    .section-title { font-size: 18px; }
    body { padding: 15px 14px 180px 14px; }
    .btn { padding: 12px 14px; font-size: 12px; }
    .lips-fab { font-size: 130px; bottom: 130px; right: -15px; }
    .jewelry { font-size: 26px; }
  }
</style>
</head>
<body>

  <h1 class="logo lux-text">PRIVÉ</h1>
  <p class="subtitle">Personal Secretary</p>

  <div class="tab-content active" id="tabTasks">
    <h2 class="section-title lux-text">СЕГОДНЯ</h2>

    <div class="input-wrap">
      <div class="row">
        <input type="text" id="taskInput" placeholder="Надиктуй или напиши задачу...">
      </div>
      <div class="row">
        <button class="btn btn-full" id="addBtn">Добавить</button>
        <button class="voice-btn" id="voiceBtn" title="Диктовка">🎙</button>
      </div>
    </div>

    <ul class="task-list" id="todayList"></ul>

    <h2 class="section-title lux-text">ДРУГИЕ ЗАДАЧИ</h2>
    <ul class="task-list" id="otherList"></ul>
  </div>

  <div class="tab-content" id="tabLists">
    <div id="listsOverview">
      <h2 class="section-title lux-text">МОИ СПИСКИ</h2>
      <button class="btn btn-full" id="addListBtn" style="margin-bottom: 20px;">+ Новый список</button>
      <ul class="list-list" id="listsList"></ul>
    </div>

    <div class="list-detail" id="listDetail">
      <button class="back-btn" id="backToLists">← Назад к спискам</button>
      <h2 class="section-title lux-text" id="listDetailTitle"></h2>
      <div class="input-wrap">
        <div class="row">
          <input type="text" id="listItemInput" placeholder="Добавить пункт...">
        </div>
        <div class="row">
          <button class="btn btn-full" id="addListItemBtn">Добавить</button>
          <button class="voice-btn" id="listVoiceBtn" title="Диктовка">🎙</button>
        </div>
      </div>
      <ul class="task-list" id="listDetailItems"></ul>
    </div>
  </div>

  <div class="voice-status" id="voiceStatus">
    <span id="voiceStatusText">Слушаю</span><span class="dots"></span>
  </div>

  <div class="lips-fab" id="lipsFab">💋</div>

  <!-- Золотые украшения внизу -->
  <div class="jewelry-container" id="jewelryContainer"></div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="tabTasks">Задачи</button>
    <button class="tab-btn" data-tab="tabLists">Списки</button>
  </div>

<script>
  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabContents = document.querySelectorAll('.tab-content');

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const voiceBtn = document.getElementById('voiceBtn');
  const lipsFab = document.getElementById('lipsFab');
  const todayList = document.getElementById('todayList');
  const otherList = document.getElementById('otherList');
  const voiceStatus = document.getElementById('voiceStatus');
  const voiceStatusText = document.getElementById('voiceStatusText');
  const jewelryContainer = document.getElementById('jewelryContainer');

  let tasks = JSON.parse(localStorage.getItem('priveTasks') || '[]');
  let lists = JSON.parse(localStorage.getItem('priveLists') || '[]');
  let isRecording = false;
  let recognition = null;
  let currentListId = null;

  const today = new Date().toISOString().split('T')[0];

  // === ЗОЛОТЫЕ УКРАШЕНИЯ ===
  const jewelryEmojis = ['💍', '👑', '💎', '✨', '📿', '🏆', '⚜️', '💫', '🌟', '⭐'];
  
  function createJewelry() {
    const count = 15 + Math.floor(Math.random() * 5); // 15-20 украшений
    
    for (let i = 0; i < count; i++) {
      const jewelry = document.createElement('div');
      jewelry.className = 'jewelry';
      jewelry.textContent = jewelryEmojis[Math.floor(Math.random() * jewelryEmojis.length)];
      
      // Случайная позиция внизу экрана
      const left = Math.random() * 100;
      const bottom = Math.random() * 80;
      const rotation = (Math.random() - 0.5) * 120; // -60 до +60 градусов
      const size = 24 + Math.random() * 20; // 24-44px
      const delay = Math.random() * 2; // задержка анимации
      
      jewelry.style.left = left + '%';
      jewelry.style.bottom = bottom + 'px';
      jewelry.style.setProperty('--rot', rotation + 'deg');
      jewelry.style.fontSize = size + 'px';
      jewelry.style.animationDelay = delay + 's';
      
      jewelryContainer.appendChild(jewelry);
    }
  }
  
  createJewelry();

  function beep(frequency = 800, duration = 150, volume = 0.3) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = frequency;
      osc.type = 'sine';
      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration / 1000);
    } catch(e) {}
  }

  function vibrate(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
  }

  function spawnFloater(type) {
    const el = document.createElement('div');
    el.className = 'floater ' + type;
    el.textContent = type === 'heart' ? '♥' : '💋';

    const startX = window.innerWidth - 80;
    const startY = window.innerHeight - 200;
    el.style.left = startX + 'px';
    el.style.top = startY + 'px';

    const upwardBias = -Math.PI / 2;
    const finalAngle = upwardBias + (Math.random() - 0.5) * Math.PI * 1.8;
    
    const distance = 300 + Math.random() * 600;
    const dx1 = Math.cos(finalAngle) * distance * 0.2;
    const dy1 = Math.sin(finalAngle) * distance * 0.2;
    const dx2 = Math.cos(finalAngle) * distance + (Math.random() - 0.5) * 400;
    const dy2 = Math.sin(finalAngle) * distance - 200;
    const r1 = (Math.random() - 0.5) * 120;
    const r2 = r1 + (Math.random() - 0.5) * 240;

    el.style.setProperty('--dx1', dx1 + 'px');
    el.style.setProperty('--dy1', dy1 + 'px');
    el.style.setProperty('--dx2', dx2 + 'px');
    el.style.setProperty('--dy2', dy2 + 'px');
    el.style.setProperty('--r1', r1 + 'deg');
    el.style.setProperty('--r2', r2 + 'deg');

    const duration = 4 + Math.random() * 3;
    el.style.animation = `floatRandom ${duration}s ease-out forwards`;
    el.style.fontSize = (24 + Math.random() * 32) + 'px';

    document.body.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000);
  }

  function launchKissBurst() {
    const count = 45 + Math.floor(Math.random() * 10); // 45-55 штук
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        spawnFloater(Math.random() > 0.4 ? 'heart' : 'kiss');
      }, i * 30); // 30мс интервал
    }
  }

  setInterval(() => {
    if (!isRecording) spawnFloater(Math.random() > 0.5 ? 'heart' : 'kiss');
  }, 1500);

  lipsFab.addEventListener('click', () => {
    launchKissBurst();
    vibrate(50);
  });

  function parseDateFromText(text) {
    const lower = text.toLowerCase();
    const todayDate = new Date();
    
    if (lower.includes('завтра')) {
      const d = new Date(todayDate); d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    }
    if (lower.includes('послезавтра')) {
      const d = new Date(todayDate); d.setDate(d.getDate() + 2);
      return d.toISOString().split('T')[0];
    }
    const daysMatch = lower.match(/через\s+(\d+)\s+дн/);
    if (daysMatch) {
      const d = new Date(todayDate); d.setDate(d.getDate() + parseInt(daysMatch[1]));
      return d.toISOString().split('T')[0];
    }
    const days = {'понедельник': 1, 'вторник': 2, 'среда': 3, 'среду': 3, 'четверг': 4, 'пятница': 5, 'пятницу': 5, 'суббота': 6, 'воскресенье': 0, 'воскресение': 0};
    for (const [word, dayNum] of Object.entries(days)) {
      if (lower.includes(word)) {
        const d = new Date(todayDate);
        const currentDay = d.getDay();
        let daysUntil = dayNum - currentDay;
        if (daysUntil <= 0) daysUntil += 7;
        d.setDate(d.getDate() + daysUntil);
        return d.toISOString().split('T')[0];
      }
    }
    return today;
  }

  function cleanTaskText(text) {
    const lower = text.toLowerCase();
    const wordsToRemove = ['завтра', 'послезавтра', 'сегодня', 'без даты', 'на сегодня'];
    const daysWords = ['в понедельник', 'во вторник', 'в среду', 'в четверг', 'в пятницу', 'в субботу', 'в воскресенье',
                       'понедельник', 'вторник', 'среду', 'четверг', 'пятницу', 'субботу', 'воскресенье'];

    let cleaned = text;
    wordsToRemove.forEach(w => {
      cleaned = cleaned.replace(new RegExp(w, 'gi'), '');
    });
    daysWords.forEach(w => {
      cleaned = cleaned.replace(new RegExp(w, 'gi'), '');
    });
    cleaned = cleaned.replace(/через\s+\d+\s+дн[яей]?\s*/gi, '');
    cleaned = cleaned.replace(/^\s*[,\s]+|[,\s]+$/g, '').trim();
    return cleaned || text;
  }

  function addTask(text, customDate) {
    const value = typeof text === 'string' ? text : taskInput.value.trim();
    if (!value) return;

    const date = customDate || parseDateFromText(value);
    const cleanText = customDate ? value : cleanTaskText(value);

    tasks.push({
      text: cleanText,
      date: date,
      done: false,
      id: Date.now()
    });
    taskInput.value = '';
    saveTasks();

    speak('Добавлено: ' + cleanText);
  }

  function speak(text) {
    if ('speechSynthesis' in window) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ru-RU';
      utter.rate = 1.1;
      utter.pitch = 1;
      window.speechSynthesis.speak(utter);
    }
  }

  function saveTasks() {
    localStorage.setItem('priveTasks', JSON.stringify(tasks));
    renderTasks();
  }

  function renderTasks() {
    todayList.innerHTML = '';
    otherList.innerHTML = '';

    const todayTasks = tasks.filter(t => t.date === today || !t.date);
    const otherTasks = tasks.filter(t => t.date && t.date !== today)
                            .sort((a, b) => a.date.localeCompare(b.date));

    if (todayTasks.length === 0) {
      todayList.innerHTML = '<li class="empty">Пока пусто. Надиктуй первую задачу</li>';
    } else {
      todayTasks.forEach((t, i) => {
        todayList.appendChild(createTaskEl(t, tasks.indexOf(t), true));
      });
    }

    if (otherTasks.length === 0) {
      otherList.innerHTML = '<li class="empty">Нет запланированных задач</li>';
    } else {
      otherTasks.forEach(t => {
        otherList.appendChild(createTaskEl(t, tasks.indexOf(t), false));
      });
    }
  }

  function createTaskEl(t, idx, isUrgent) {
    const li = document.createElement('li');
    li.className = 'task' + (isUrgent ? ' urgent' : '') + (t.done ? ' done' : '');

    const span = document.createElement('span');
    span.className = 'task-text';
    span.textContent = t.text;

    const date = document.createElement('span');
    date.className = 'task-date';
    date.textContent = t.date ? formatDate(t.date) : 'сегодня';

    const check = document.createElement('button');
    check.className = 'task-btn';
    check.textContent = t.done ? '↩' : '✓';
    check.onclick = () => { tasks[idx].done = !tasks[idx].done; saveTasks(); };

    const del = document.createElement('button');
    del.className = 'task-btn del';
    del.textContent = '×';
    del.onclick = () => { tasks.splice(idx, 1); saveTasks(); };

    li.append(span, date, check, del);
    return li;
  }

  function formatDate(d) {
    const date = new Date(d);
    const opts = { day: 'numeric', month: 'short' };
    return date.toLocaleDateString('ru-RU', opts);
  }

  function showStatus(text) {
    voiceStatusText.textContent = text;
    voiceStatus.classList.add('show');
  }

  function hideStatus() {
    voiceStatus.classList.remove('show');
  }

  function startVoice(targetInput, callback) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      showStatus('Голосовой ввод не поддерживается');
      setTimeout(hideStatus, 2000);
      return;
    }

    recognition = new SR();
    recognition.lang = 'ru-RU';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isRecording = true;
      voiceBtn.classList.add('recording');
      voiceBtn.textContent = '⏹';
      showStatus('Слушаю');
      vibrate([50, 30, 50]);
      beep(880, 200, 0.3);
    };

    recognition.onresult = e => {
      const text = e.results[0][0].transcript;
      targetInput.value = text;
      stopVoice();
      showStatus('Распознано');
      setTimeout(() => {
        if (callback) callback(text);
        hideStatus();
      }, 600);
    };

    recognition.onerror = e => {
      console.error('Speech error:', e.error);
      showStatus('Ошибка: ' + e.error);
      stopVoice();
      setTimeout(hideStatus, 2000);
    };

    recognition.onend = () => {
      if (isRecording) {
        try { recognition.start(); } catch(e) { stopVoice(); }
      }
    };

    try {
      recognition.start();
    } catch(e) {
      showStatus('Не удалось запустить микрофон');
      setTimeout(hideStatus, 2000);
    }
  }

  function stopVoice() {
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
    }
    isRecording = false;
    voiceBtn.classList.remove('recording');
    voiceBtn.textContent = '🎙';
    vibrate(100);
    beep(440, 200, 0.3);
  }

  addBtn.addEventListener('click', () => {
    addTask();
    launchKissBurst();
  });

  voiceBtn.addEventListener('click', () => {
    if (isRecording) stopVoice();
    else startVoice(taskInput, (text) => addTask(text));
  });

  taskInput.addEventListener('keypress', e => {
    if (e.key === 'Enter') {
      addTask();
      launchKissBurst();
    }
  });

  const addListBtn = document.getElementById('addListBtn');
  const listsList = document.getElementById('listsList');
  const listsOverview = document.getElementById('listsOverview');
  const listDetail = document.getElementById('listDetail');
  const listDetailTitle = document.getElementById('listDetailTitle');
  const listDetailItems = document.getElementById('listDetailItems');
  const backToLists = document.getElementById('backToLists');
  const listItemInput = document.getElementById('listItemInput');
  const addListItemBtn = document.getElementById('addListItemBtn');
  const listVoiceBtn = document.getElementById('listVoiceBtn');

  function saveLists() {
    localStorage.setItem('priveLists', JSON.stringify(lists));
    renderLists();
  }

  function renderLists() {
    listsList.innerHTML = '';

    if (lists.length === 0) {
      listsList.innerHTML = '<li class="empty">Нет сохранённых списков</li>';
    } else {
      lists.forEach((list, idx) => {
        const li = document.createElement('li');
        li.className = 'list-card';
        
        const title = document.createElement('div');
        title.className = 'list-card-title';
        title.textContent = list.name;

        const count = document.createElement('div');
        count.className = 'list-card-count';
        const doneCount = list.items.filter(i => i.done).length;
        count.textContent = `${list.items.length} пунктов, выполнено: ${doneCount}`;

        const del = document.createElement('button');
        del.className = 'list-btn del';
        del.textContent = '×';
        del.style.position = 'absolute';
        del.style.right = '10px';
        del.style.top = '10px';
        del.onclick = (e) => {
          e.stopPropagation();
          if (confirm('Удалить список "' + list.name + '"?')) {
            lists.splice(idx, 1);
            saveLists();
          }
        };

        li.append(title, count, del);
        li.onclick = () => openList(idx);
        listsList.appendChild(li);
      });
    }
  }

  function openList(idx) {
    currentListId = idx;
    const list = lists[idx];
    listDetailTitle.textContent = list.name;
    listsOverview.style.display = 'none';
    listDetail.classList.add('active');
    renderListItems();
  }

  function closeList() {
    currentListId = null;
    listDetail.classList.remove('active');
    listsOverview.style.display = 'block';
    listItemInput.value = '';
  }

  function renderListItems() {
    listDetailItems.innerHTML = '';
    const list = lists[currentListId];

    if (list.items.length === 0) {
      listDetailItems.innerHTML = '<li class="empty">Список пуст. Добавь первый пункт</li>';
    } else {
      list.items.forEach((item, idx) => {
        const li = document.createElement('li');
        li.className = 'task' + (item.done ? ' done' : '');

        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = item.text;

        const check = document.createElement('button');
        check.className = 'task-btn';
        check.textContent = item.done ? '↩' : '✓';
        check.onclick = () => {
          lists[currentListId].items[idx].done = !lists[currentListId].items[idx].done;
          saveLists();
          renderListItems();
        };

        const del = document.createElement('button');
        del.className = 'task-btn del';
        del.textContent = '×';
        del.onclick = () => {
          lists[currentListId].items.splice(idx, 1);
          saveLists();
          renderListItems();
        };

        li.append(span, check, del);
        listDetailItems.appendChild(li);
      });
    }
  }

  function addListItem(text) {
    const value = typeof text === 'string' ? text : listItemInput.value.trim();
    if (!value || currentListId === null) return;

    const items = value.split(/[,;]| и /).map(s => s.trim()).filter(s => s);
    
    items.forEach(item => {
      lists[currentListId].items.push({
        text: item,
        done: false,
        id: Date.now() + Math.random()
      });
    });

    listItemInput.value = '';
    saveLists();
    renderListItems();
  }

  addListBtn.addEventListener('click', () => {
    const name = prompt('Название списка:');
    if (name && name.trim()) {
      lists.push({
        name: name.trim(),
        items: [],
        id: Date.now()
      });
      saveLists();
      launchKissBurst();
    }
  });

  backToLists.addEventListener('click', closeList);

  addListItemBtn.addEventListener('click', () => addListItem());

  listVoiceBtn.addEventListener('click', () => {
    if (isRecording) stopVoice();
    else startVoice(listItemInput, (text) => addListItem(text));
  });

  listItemInput.addEventListener('keypress', e => {
    if (e.key === 'Enter') addListItem();
  });

  renderTasks();
  renderLists();
</script>
</body>
</html>
